# Frappe CRM served on whatsapp.billingfast.com
# Routing note: crm.localhost is the default site with serve_default_site=true,
# so requests for this Host are served by it automatically.
# Start as HTTP-only; `certbot --nginx -d whatsapp.billingfast.com` adds the 443
# block + HTTP->HTTPS redirect (same as the other billingfast subdomains).
server {
    listen 80;
    server_name whatsapp.billingfast.com;

    client_max_body_size 100M;

    # Frappe realtime (Socket.IO) -> node socketio on 9000
    location /socket.io/ {
        proxy_pass http://127.0.0.1:9000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 600;
    }

    # Everything else -> Frappe web (gunicorn/werkzeug) on 8000
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 600;
    }
}
